name: Keep Supabase Alive

on:
  schedule:
    - cron: "0 8 */3 * *"  # setiap 3 hari sekali jam 08:00 UTC
  workflow_dispatch:        # bisa juga dijalankan manual

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}")
          echo "Supabase responded with HTTP $STATUS"
          if [ "$STATUS" -lt 200 ] || [ "$STATUS" -ge 500 ]; then
            echo "Unexpected status: $STATUS"
            exit 1
          fi
