<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Halaman Tidak Ditemukan — Hadirku</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f6;
      color: #1a1a1a;
      font-family: 'Inter', sans-serif;
      padding: 1.5rem;
      text-align: center;
    }

    .card {
      max-width: 360px;
      width: 100%;
    }

    .ornament {
      display: flex;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .ornament svg {
      width: 64px;
      height: 64px;
      opacity: 0.18;
    }

    .code {
      font-family: 'Playfair Display', serif;
      font-size: clamp(4rem, 18vw, 6rem);
      font-weight: 600;
      line-height: 1;
      background: linear-gradient(135deg, #b08d57 0%, #9a7040 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -0.02em;
    }

    .title {
      font-family: 'Playfair Display', serif;
      font-size: 1.25rem;
      font-weight: 600;
      margin-top: 0.75rem;
      color: #1a1a1a;
    }

    .desc {
      margin-top: 0.625rem;
      font-size: 0.875rem;
      line-height: 1.6;
      color: #6b6b6b;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin: 1.75rem 0;
      opacity: 0.2;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: #b08d57;
    }

    .divider-dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: #b08d57;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.75rem 1.75rem;
      border-radius: 0.625rem;
      font-family: 'Inter', sans-serif;
      font-size: 0.8125rem;
      font-weight: 500;
      text-decoration: none;
      letter-spacing: 0.01em;
      background: linear-gradient(135deg, #b08d57 0%, #9a7040 100%);
      color: #fff;
      box-shadow: 0 4px 16px rgba(176, 141, 87, 0.3);
      transition: opacity 0.15s, transform 0.15s;
    }

    .btn:hover { opacity: 0.88; transform: translateY(-1px); }
    .btn:active { transform: translateY(0); }

    .countdown {
      margin-top: 1.25rem;
      font-size: 0.75rem;
      color: #9a9a9a;
    }

    .countdown span {
      font-weight: 600;
      color: #b08d57;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="ornament">
      <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M32 4 L34 28 L58 28 L38 42 L46 64 L32 50 L18 64 L26 42 L6 28 L30 28 Z" fill="#b08d57"/>
      </svg>
    </div>

    <p class="code">404</p>
    <h1 class="title">Halaman tidak ditemukan</h1>
    <p class="desc">
      Link yang Anda buka mungkin sudah tidak aktif<br />
      atau alamatnya salah.
    </p>

    <div class="divider"><span class="divider-dot"></span></div>

    <a href="/hadirku/" class="btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9L12 2L21 9V20a1 1 0 01-1 1H5a1 1 0 01-1-1z"/><polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
      Kembali ke Beranda
    </a>

    <p class="countdown">Dialihkan otomatis dalam <span id="sec">5</span> detik&hellip;</p>
  </div>

  <script>
    var sec = 5;
    var el  = document.getElementById('sec');
    var iv  = setInterval(function () {
      sec--;
      if (el) el.textContent = sec;
      if (sec <= 0) {
        clearInterval(iv);
        window.location.replace('/hadirku/');
      }
    }, 1000);
  </script>
</body>
</html>
